,action:'次のアクション案',actionText:'屋内の代替プランと二次交通を現地事業者に確認。仮想シナリオであり、現在の注意報ではありません。',source:'必要データ：日次来訪者数、中央気象署の天気、TDXの交通情報、地域の宿泊データ。',timeline:'今後7日間 · 来訪需要',timelineNote:'参考指数 • 検証済み予測ではありません',date:'日目',index:'需要指数',marketTitle:'2つの市場、それぞれの意思決定。',marketSub:'旅行方向、集計期間、来訪者の定義を分けて比較します。',toTW:'日本 → 台湾',toJP:'台湾 → 日本',arrivals:'月別入境者数',stay:'延べ宿泊者数',spend:'旅行消費額',pending:'未接続',marketBody:'公式の市場別入境統計から季節性と施策の実施時期を検討。地域の宿泊統計や調査結果は定義と期間を確認して組み合わせます。',marketSource:'候補データ提供元',jpSource:'JNTO 日本の観光統計データ',twSource:'台湾交通部観光署',marketAction:'支援する意思決定',marketDecision:'次の試験的な誘客施策を、どの地域・時期に実施するか？',dataTitle:'利用可能な根拠から始める。',dataSub:'公式公開情報を別途調査。共有されたデータ一覧はアクセス未確認です。',category:'データ',priority:'優先度',use:'支援する判断',limit:'制約・接続条件',link:'提供元',summaryTitle:'現状把握から効果測定できる試行へ。',summarySub:'観光行政・DMO・観光事業者向け。',s1:'01 / 需要を理解する',s2:'02 / 受入体制を整える',s3:'03 / 成果を追跡する',b1:'月別入境・景点統計で季節性を確認。7日間の来訪予測には、事業者の日次実績データが必要です。',b2:'天気、交通、宿泊の情報を組み合わせ、合意したアクションに担当者と期限を設定します。',b3:'宿泊数、消費額、満足度を基準値と比較。単なる実施前後の差は施策効果の証明ではありません。',warning:'表示されている数値は画面検討用の架空データです。天気・稼働率・需要は現在の状況を示していません。',learn:'候補データを確認',inventory:'データ一覧の評価は保留：共有Googleシートは組織のアクセス制限により閲覧できません。優先度は暫定です。'}};

const sources=[['Attraction visits','景点別来訪者数','P1','Monthly seasonality / regional demand','月別の季節性・地域需要','Monthly counts; methodology varies. Annual open-file refresh is not real time.','月次集計。計数方法は地点別に確認。公開ファイルの年次更新はリアルタイムではありません。','https://data.gov.tw/en/datasets/8116'],['Weather observations & forecasts','気象観測・予報','P1','Weather exposure and planning','天候リスクと受入準備','CWA API credentials, location matching and issue times need validation. Does not predict visitors.','API認証・地点対応・発表時刻を要確認。来訪者予測ではありません。','https://opendata.cwa.gov.tw/dist/opendata-swagger.html'],['Transport / tourism POIs','交通・観光地点','P1','Last-mile access and destination registry','二次交通と観光地台帳','Check TDX endpoint coverage, credentials and limits. Transit passengers are not all tourists.','TDXの対象範囲・認証・制限を確認。乗客数と観光客数は異なります。','https://tdx.transportdata.tw/'],['Hotel operations','宿泊施設の営業統計','P1','Seasonality and accommodation capacity','宿泊の季節性と供給力','Monthly aggregate reports do not show live room inventory or forward bookings.','月次集計は現在の空室や将来の予約を示しません。','https://admin.taiwan.net.tw/english/info/IssuePage?a=14986'],['Japan ↔ Taiwan market statistics','日台の市場統計','P1','Source-market trends and campaign timing','客源市場の動向と施策時期','Align residence / nationality, units and months. Check reuse terms on both sides.','居住地・国籍、単位、月を統一。双方の利用条件を確認。','https://statistics.jnto.go.jp/en/'],['Daily ticket / entry–exit data','日次チケット・入退場データ','P0*','Train and validate visitor forecasts','来訪予測の学習・検証','Partner data required; no source connected. Monthly statistics alone are insufficient.','事業者データが必要。未接続。月次統計のみでは不十分。',null],['Reviews / social sentiment','口コミ・SNS感情分析','P2','Identify visitor friction','旅行者の不満点を把握','Not assumed open. Confirm licences, language coverage and sampling bias.','オープンデータとは限りません。利用条件・言語・標本の偏りを確認。',null]];
let lang='en',view='map',site=0,day=0,direction='tw',layers=new Set(['weather','demand','transport']);const t=k=>strings[lang][k];const name=()=>places[site][lang==='en'?0:1];
function draw(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelector('#en').setAttribute('aria-pressed',lang==='en');document.querySelector('#ja').setAttribute('aria-pressed',lang==='ja');document.querySelector('#nav').innerHTML=['map','markets','data','summary'].map(v=>`<button class="${view===v?'active':''}" data-view="${v}" aria-pressed="${view===v}">${t(v)}</button>`).join('');document.querySelector('#help').textContent=t('help');document.querySelector('#heading').textContent=t(({map:'mapTitle',markets:'marketTitle',data:'dataTitle',summary:'summaryTitle'})[view]);document.querySelector('#subheading').textContent=t(({map:'mapSub',markets:'marketSub',data:'dataSub',summary:'summarySub'})[view]);const main=document.querySelector('#main');
if(view==='map'){main.innerHTML=`<div class="layout"><aside class="panel layers"><h2>${t('layers')}</h2>${['weather','demand','transport','hotels'].map(l=>`<label><input type="checkbox" data-layer="${l}" ${layers.has(l)?'checked':''}><span>${t(l)}<small>${t('layerSub')}</small></span></label>`).join('')}<p class="mini" style="margin-top:18px">${t('source')}</p></aside><section class="panel map ${[...layers].join(' ')}"><div class="map-label">${t('mapNote')}</div><svg viewBox="0 0 600 460" aria-label="${lang==='en'?'Schematic Taiwan map':'台湾の模式図'}"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff06"/></pattern></defs><rect width="600" height="460" fill="url(#grid)"/><path d="M390 52 Q425 68 405 109 L381 169 Q360 250 309 331 L260 411 Q242 439 225 402 L193 337 Q182 301 210 247 L238 183 Q277 123 334 84Z" fill="#264b4d" stroke="#658c88" stroke-width="2"/><path class="route" d="M384 88 L282 198 L252 267 L180 322 L210 382 M384 88L408 198" fill="none" stroke="#b5b4ff" stroke-width="2" stroke-dasharray="6 7"/></svg>${places.map((p,i)=>`<button class="place ${i===site?'selected':''}" data-site="${i}" style="left:${p[2]}%;top:${p[3]}%" aria-pressed="${i===site}">${p[lang==='en'?0:1]}</button>`).join('')}<div class="map-foot">${t('mapFoot')}</div></section><aside class="panel detail"><div class="eyebrow">${t('site')}</div><h1 style="font-size:24px">${name()}</h1><span class="pill">${t('demo')}</span><div class="statrow"><span>${t('visitors')}</span><b>${Math.round(places[site][4]*(1+day*.08)).toLocaleString()}</b></div>${layers.has('weather')?`<div class="statrow"><span>${t('rain')}</span><b>${30+site*5+day*3}%</b></div>`:''}${layers.has('hotels')?`<div class="statrow"><span>${t('occupancy')}</span><b>${55+site*3+day}%</b></div>`:''}<div class="action"><h3>${t('action')}</h3><p>${t('actionText')}</p></div><p class="mini" style="margin-top:14px">${t('warning')}</p></aside></div><section class="panel timeline"><div class="timeline-head"><h2>${t('timeline')}</h2><span class="mini">${name()} · ${lang==='ja'?(day+1)+'日目':'Day '+(day+1)} · ${t('index')} ${[80,87,75,91,108,132,118][day]}</span><span class="pill">${t('timelineNote')}</span></div><svg viewBox="0 0 1000 105" preserveAspectRatio="none" aria-label="${t('timelineNote')}"><path d="M0 80 L166 69 L333 88 L500 62 L666 40 L833 10 L1000 26 L1000 105H0Z" fill="#b5b4ff22"/><path d="M0 80 L166 69 L333 88 L500 62 L666 40 L833 10 L1000 26" fill="none" stroke="#b5b4ff" stroke-width="2"/><line x1="${day*166.6}" x2="${day*166.6}" y1="0" y2="105" stroke="#8ee4cc" stroke-width="2"/></svg><input type="range" id="day" min="0" max="6" step="1" value="${day}" aria-label="${t('timeline')}"><div class="days">${Array.from({length:7},(_,i)=>`<span>${lang==='ja'?(i+1)+'日目':'Day '+(i+1)}</span>`).join('')}</div></section>`;}
if(view==='markets')main.innerHTML=`<section class="secondary"><div class="direction"><button data-dir="tw" class="${direction==='tw'?'active':''}">${t('toTW')}</button><button data-dir="jp" class="${direction==='jp'?'active':''}">${t('toJP')}</button></div><div class="grid">${['arrivals','stay','spend'].map(k=>`<div class="panel"><h2>${t(k)}</h2><div class="big">—</div><span class="pill">${t('pending')}</span></div>`).join('')}</div><div class="panel" style="margin-top:16px"><h2>${t('marketAction')}</h2><h1>${t('marketDecision')}</h1><p>${t('marketBody')}</p><p style="margin-top:20px">${t('marketSource')}: <a href="${direction==='tw'?'https://admin.taiwan.net.tw/english/info/IssuePage?a=14986':'https://statistics.jnto.go.jp/en/'}" target="_blank" rel="noreferrer">${t(direction==='tw'?'twSource':'jpSource')} ↗</a></p></div></section>`;
if(view==='data')main.innerHTML=`<section class="secondary panel"><div class="notice">${t('inventory')}</div><table><thead><tr>${['category','priority','use','limit','link'].map(k=>`<th>${t(k)}</th>`).join('')}</tr></thead><tbody>${sources.map(s=>`<tr><td><b>${s[lang==='en'?0:1]}</b></td><td><span class="pill">${s[2]}</span></td><td>${s[lang==='en'?3:4]}</td><td>${s[lang==='en'?5:6]}</td><td>${s[7]?`<a target="_blank" rel="noreferrer" href="${s[7]}">↗ ${t('link')}</a>`:t('pending')}</td></tr>`).join('')}</tbody></table><p class="mini" style="margin-top:14px">${lang==='en'?'P0* = prerequisite for credible daily forecasting; P1 = first integration; P2 = later exploration. Source pages checked 9 Nov 2026; datasets not ingested.':'P0*＝信頼できる日次予測の前提、P1＝初期接続、P2＝後続検討。2026年11月9日に提供元ページを確認。データ取込は未実施。'}</p></section>`;
if(view==='summary')main.innerHTML=`<section class="secondary"><div class="grid">${[1,2,3].map(i=>`<div class="panel"><div class="eyebrow">${t('s'+i)}</div><p style="margin-top:20px">${t('b'+i)}</p></div>`).join('')}</div><div class="notice">${t('inventory')}</div><button data-view="data">${t('learn')} →</button></section>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='en'||b.id==='ja')lang=b.id;else if(b.id==='guide'){document.querySelector('#help').classList.toggle('hidden');return}else if(b.dataset.view)view=b.dataset.view;else if(b.dataset.site!==undefined)site=Number(b.dataset.site);else if(b.dataset.dir)direction=b.dataset.dir;else return;draw()});document.addEventListener('change',e=>{if(e.target.dataset.layer){const l=e.target.dataset.layer;e.target.checked?layers.add(l):layers.delete(l);draw()}if(e.target.id==='day'){day=Number(e.target.value);draw()}});draw();
