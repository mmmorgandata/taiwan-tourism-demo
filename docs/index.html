<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taiwan Tourism Intelligence — Concept demo</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js"></script>
<style>
:root{color-scheme:dark;--bg:#09121b;--panel:#101e2b;--panel2:#132434;--line:#263746;--muted:#99adba;--text:#edf4f6;--green:#8ee4cc;--amber:#e9c980;--blue:#8fc3ff;--purple:#b5b4ff;--red:#f2a0a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
button{font:inherit;color:inherit;border:1px solid var(--line);background:#172838;border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover,button.active{background:#29463f;border-color:var(--green)}
button:focus-visible,a:focus-visible{outline:3px solid var(--green);outline-offset:1px}
a{color:var(--green)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);gap:16px}
.brand{font-size:18px;font-weight:700;white-space:nowrap}.brand span{color:var(--green)}
nav{display:flex;gap:6px;flex-wrap:wrap}
.meta{display:flex;gap:6px;align-items:center}
.pill{display:inline-block;font-size:11px;letter-spacing:.04em;border:1px solid #6b6045;border-radius:20px;padding:3px 9px;color:var(--amber);white-space:nowrap}
.intro{padding:16px 24px 10px;display:flex;justify-content:space-between;align-items:end;gap:16px}
h1{font-size:26px;margin:2px 0 4px;font-weight:600}
p{color:var(--muted);margin:4px 0}
.eyebrow{color:var(--green);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:15px;margin:0 0 12px}h3{font-size:13px;margin:0 0 6px}
.mini{font-size:11px;color:var(--muted)}
.hidden{display:none!important}
.wrap{margin:0 24px 18px}
/* provenance chips */
.prov{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.03em;border-radius:20px;padding:2px 8px;border:1px solid;white-space:nowrap;vertical-align:middle}
.prov:before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.prov.obs{color:var(--green);border-color:#3f6d61}
.prov.est{color:var(--amber);border-color:#6b6045}
.prov.fc{color:var(--blue);border-color:#3e5c7c}
.prov.ill{color:var(--purple);border-color:#55547d;border-style:dashed}
.prov.nc{color:var(--muted);border-color:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:9px 14px;margin:0 24px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.legend span.txt{font-size:11px;color:var(--muted)}
/* map view */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 24px 12px}
.toolbar .lab{font-size:12px;color:var(--muted);margin-right:2px}
.layout{display:grid;grid-template-columns:230px minmax(340px,1fr) 300px;gap:12px;margin:0 24px}
.layers label{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.layers input{accent-color:var(--green);margin-top:3px}
.layers small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.map{position:relative;padding:0;overflow:hidden;background:#0c1b29;min-height:480px}
#lmapHost,#lmap{position:absolute;inset:0}
#lmap{background:#0c1b29;font:inherit}
.map-label{position:absolute;top:10px;left:56px;z-index:500;color:#cfe0e6;font-size:11px;background:#09121bcc;padding:4px 8px;border-radius:6px;pointer-events:none}
.basemaps{position:absolute;top:10px;right:10px;z-index:500;display:flex;gap:4px}
.basemaps button{padding:4px 9px;font-size:11.5px;background:#09121be6}
.map-foot{position:absolute;bottom:8px;left:10px;z-index:500;color:#cfe0e6;font-size:10.5px;background:#09121bcc;padding:3px 8px;border-radius:6px;pointer-events:none;max-width:60%}
.map-fallback{padding:40px;color:var(--muted)}
.leaflet-tooltip.lbl{background:#09121bdd;border:1px solid #31475a;color:#e6f0ef;font-size:12px;padding:2px 7px;border-radius:6px;box-shadow:none}
.leaflet-tooltip.lbl:before{display:none}
.leaflet-tooltip.lbl.sel{border-color:var(--green);color:var(--green);font-weight:700;z-index:1000}
.mk{margin-left:6px;font-size:10.5px;font-weight:600}.mk.poi{color:var(--amber)}.mk.stay{color:var(--purple)}
.leaflet-container a{color:#2a7d6a}.leaflet-control-attribution{font-size:10px}
.leaflet-bar a{background:#172838;color:#edf4f6;border-color:#263746}.leaflet-bar a:hover{background:#29463f}
.tiles-streets{filter:brightness(.8) saturate(.8)}
select{font:inherit;color:inherit;background:#172838;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.pt{cursor:pointer}
.pt text{font-size:12px;fill:#dfe9ec;paint-order:stroke;stroke:#0b1a26;stroke-width:4px}
.pt.sel text{fill:var(--green);font-weight:700}
.pt:focus{outline:none}.pt:focus-visible circle.core{stroke:#fff;stroke-width:3}
.statrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.statrow .k{display:flex;flex-direction:column;gap:3px}
.statrow b{color:var(--text);font-size:15px;white-space:nowrap}
.statrow small{font-size:10.5px;color:var(--muted)}
.flow{margin-top:12px;padding:12px;background:#1a2f2a;border-radius:10px}
.flow ol{margin:6px 0 0;padding-left:18px;color:#b9cfc7;font-size:12px}
.flow li{margin:3px 0}
/* timeline */
.timeline{margin:12px 24px 18px;padding:10px 14px 8px}
.tl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:26px}
.tl-head h2{margin:0;font-size:13px}
.tl-head .val{font-size:12px;color:var(--muted)}
.tl-head .sp{flex:1}
.timeline svg{display:block;width:100%;height:170px;margin-top:4px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:2px}
.days button{padding:3px 0;font-size:11px;background:transparent;border-color:transparent;color:var(--muted)}
.days button.active{color:var(--green);border-color:#3f6d61;background:#16302a}
/* markets */
.direction{display:flex;gap:8px;margin:0 0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.big{font-size:28px;font-weight:600;color:var(--text);margin:8px 0 4px}
.delta{font-size:13px;color:var(--green)}
.card-foot{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.notice{padding:10px 14px;background:#292a22;border-left:3px solid #d6bc7b;color:#e1d8b9;font-size:12px;margin:12px 0}
.ok{padding:10px 14px;background:#16302a;border-left:3px solid var(--green);color:#cfe9df;font-size:12px;margin:12px 0}
ul.src{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--muted)}
ul.src li{margin:3px 0}
/* data table */
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.count{cursor:pointer;text-align:left;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.count b{display:block;font-size:24px;margin-top:2px}
.count.active{border-color:var(--green);background:#16302a}
.st{display:inline-block;font-size:11px;border-radius:6px;padding:2px 7px;white-space:nowrap;font-weight:600}
.st.now{background:#1d4a3f;color:var(--green)}
.st.verify{background:#4a3f1d;color:var(--amber)}
.st.later{background:#24364a;color:var(--blue)}
.st.notnow{background:#3a2328;color:var(--red)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
td,th{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:11.5px;position:sticky;top:0;background:var(--panel)}
td .g{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.tablewrap{overflow:auto;max-height:none}
.log{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.log ul{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--muted)}
.log li{margin:4px 0}
.footer{margin:6px 24px 22px;font-size:11.5px;color:var(--muted)}
.help{margin:0 24px 12px;font-size:13px;color:var(--muted)}
@media(max-width:1100px){.layout{grid-template-columns:200px 1fr}.detail{grid-column:1/-1}.grid3,.log{grid-template-columns:1fr}.counts{grid-template-columns:repeat(2,1fr)}header{flex-wrap:wrap}}
@media(max-width:680px){header,.intro{padding:12px 14px}.layout,.toolbar,.legend,.wrap,.timeline,.help,.footer{margin-left:12px;margin-right:12px}.layout{grid-template-columns:1fr}.layers{display:flex;flex-wrap:wrap;gap:4px 12px}.layers h2{width:100%;margin:0}.layers label{padding:4px 0;border:0}.layers small{display:none}.intro{flex-direction:column;align-items:start}h1{font-size:22px}.map{min-height:440px}.map-label,.map-foot{display:none}.basemaps button{padding:3px 7px;font-size:11px}.timeline svg{height:140px}.days button{font-size:10px}table{display:block;overflow:auto}}
</style>
</head>

<div class="legend" id="legend"></div>
<main id="main"></main>

function project(pts,W,H,pad){ // pts: [lat,lon]
  const lats=pts.map(p=>p[0]),lons=pts.map(p=>p[1]);
  const midLat=(Math.min(...lats)+Math.max(...lats))/2,kx=Math.cos(midLat*Math.PI/180);
  const x0=Math.min(...lons),x1=Math.max(...lons),y0=Math.min(...lats),y1=Math.max(...lats);
  const s=Math.min((W-2*pad)/((x1-x0)*kx),(H-2*pad)/(y1-y0));
  const ox=(W-(x1-x0)*kx*s)/2,oy=(H-(y1-y0)*s)/2;
  return ([lat,lon])=>[ox+(lon-x0)*kx*s,oy+(y1-lat)*s];
}

  if(lmap)return lmap;
  mapEl=document.createElement('div');mapEl.id='lmap';mapEl.setAttribute('aria-label','Map');
  lmap=L.map(mapEl,{zoomControl:true,attributionControl:true,zoomSnap:.25,scrollWheelZoom:true});
  mapEl.style.position='absolute';mapEl.style.inset='0';
  lmap.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  baseGroup=L.layerGroup().addTo(lmap);overlay=L.layerGroup().addTo(lmap);
  return lmap;
}
function setBase(){baseGroup.clearLayers();BASEMAPS[basemap].layers.forEach(([u,o])=>baseGroup.addLayer(L.tileLayer(u,o)))}
function updateMap(){
  const host=document.getElementById('lmapHost');if(!host)return;
  if(!ensureMap()){host.innerHTML=`<div class="map-fallback">${lang==='en'?'Map library failed to load.':'地図ライブラリを読み込めませんでした。'}</div>`;return}
  host.appendChild(mapEl);
  if(baseGroup._base!==basemap){setBase();baseGroup._base=basemap}
  overlay.clearLayers();
  const P=scope==='pilot'?PILOT:ALL,maxE=P[0][4];
  if(layers.has('access')){
    if(scope==='pilot')LINES.forEach(l=>overlay.addLayer(L.polyline(l.p,{color:l.c,weight:4,opacity:.75,dashArray:'1 0'})));
    else{overlay.addLayer(L.polyline(HSR,{color:'#e8a35b',weight:3,opacity:.85,dashArray:'8 6'}));overlay.addLayer(L.polyline(EAST,{color:'#b5b4ff',weight:3,opacity:.85,dashArray:'4 6'}))}
  }
  P.forEach((p,i)=>{
    const ll=[p[2],p[3]],sel=i===site,rel=p[4]/maxE;
    if(layers.has('flow')&&scope==='pilot')overlay.addLayer(L.circle(ll,{radius:250+rel*900,stroke:false,fillColor:'#8ee4cc',fillOpacity:.18,interactive:false}));
    if(layers.has('weather')){const r=rain(i,day);overlay.addLayer(L.circleMarker(ll,{radius:10+r/7,color:'#8fc3ff',weight:2,opacity:r/110,dashArray:'2 4',fill:false,interactive:false}))}
    if(scope==='all'&&layers.has('poi'))overlay.addLayer(L.circle(ll,{radius:4000+rel*16000,stroke:false,fillColor:'#e9c980',fillOpacity:.12,interactive:false}));
    let badge='';if(sel&&layers.has('poi')&&p[5])badge+=`<span class="mk poi">▲${p[5]}</span>`;if(sel&&layers.has('stay'))badge+=`<span class="mk stay">■${p[6]}</span>`;
    const m=L.circleMarker(ll,{radius:sel?9:6,color:'#0b1a26',weight:2,fillColor:sel?'#8ee4cc':'#e6f0ef',fillOpacity:1,bubblingMouseEvents:false});
    const dir=scope==='pilot'?PILOT_DIR[i]:'right';
    m.bindTooltip(`${L_(p)}${badge}`,{permanent:true,direction:dir,offset:dir==='left'?[-8,0]:dir==='bottom'?[0,8]:[8,0],className:'lbl'+(sel?' sel':'')});
    m.on('click',()=>{site=i;draw()});
    overlay.addLayer(m);
  });
  if(lastScope!==scope){lastScope=scope;requestAnimationFrame(()=>{lmap.invalidateSize();lmap.fitBounds(L.latLngBounds(P.map(p=>[p[2],p[3]])).pad(scope==='pilot'?.12:.08))})}
  else requestAnimationFrame(()=>lmap.invalidateSize());
}
const L_=p=>p[lang==='en'?0:1];
const gmaps=p=>`https://www.google.com/maps/search/${encodeURIComponent(p[1])}/@${p[2].toFixed(5)},${p[3].toFixed(5)},${scope==='pilot'?16:12}z`;
function rain(i,d){return [30,45,60,40,25,55,70][(i+d)%7]}

function detail(){
  const P=scope==='pilot'?PILOT:ALL,p=P[site],f=1+(TL[day]-100)/250;
  let rows='';
  if(scope==='pilot'){
    rows+=row(t('m_entries'),t('m_entriesS'),layers.has('flow')?fmt(Math.round(p[4]*f/100)*100):'—','ill');
    rows+=row(t('m_share'),t('m_shareS'),'—','nc');
  }else rows+=row(t('m_visits'),t('m_visitsS'),fmt(Math.round(p[4]*f)),'ill');
  if(layers.has('weather'))rows+=row(t('m_rain'),t('m_rainS'),rain(site,day)+'%','ill');
  if(layers.has('poi'))rows+=row(t('m_events'),t('m_eventsS'),p[5],'ill');
  if(layers.has('stay'))rows+=row(t('m_stay'),t('m_stayS'),p[6],'ill');
  if(layers.has('access'))rows+=row(t('m_access'),t('m_accessS'),t('m_accessV'),'ill');
  return `<div class="eyebrow">${t('brief')}</div><h1 style="font-size:22px;margin-bottom:2px">${loc(p)}</h1><a class="mini" href="${gmaps(p)}" target="_blank" rel="noreferrer">↗ ${t('gmaps')}</a>${rows}
  <div class="flow"><h3>${t('flowTitle')}</h3><ol>${[1,2,3,4,5].map(i=>`<li>${t('flow'+i)}</li>`).join('')}</ol></div>`;
}
function row(k,s,v,pv){return `<div class="statrow"><div class="k"><span>${k}</span><small>${s}</small></div><div style="text-align:right"><b>${v}</b><br>${prov(pv)}</div></div>`}

function timeline(){
  const P=scope==='pilot'?PILOT:ALL,W=1000,H=170,top=14,bot=24;
  const mn=60,mx=140,X=i=>40+i*(W-80)/6,Y=v=>top+(mx-v)/(mx-mn)*(H-top-bot);
  const pts=TL.map((v,i)=>[X(i),Y(v)]);
  const d='M'+pts.map(p=>p.join(',')).join(' L');
  const base=Y(100);
  return `<section class="panel timeline"><div class="tl-head"><h2>${t('tlTitle')}</h2><span class="val">${loc(P[site])} · ${lang==='ja'?(day+1)+t('day'):t('day')+' '+(day+1)} · ${t('idx')} <b style="color:var(--text)">${TL[day]}</b></span><span class="sp"></span>${prov('ill')}<span class="mini">${t('tlNote')}</span></div>
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="${t('tlTitle')}">
  <line x1="40" x2="${W-40}" y1="${base}" y2="${base}" stroke="#ffffff22" stroke-dasharray="4 6"/>
  <path d="${d} L${X(6)},${H-bot} L${X(0)},${H-bot}Z" fill="#b5b4ff1f"/>
  <path d="${d}" fill="none" stroke="#b5b4ff" stroke-width="3" stroke-dasharray="9 5" vector-effect="non-scaling-stroke"/>
  <line x1="${X(day)}" x2="${X(day)}" y1="${top-6}" y2="${H-bot}" stroke="#8ee4cc" stroke-width="2" vector-effect="non-scaling-stroke"/>
  ${pts.map((p,i)=>`<rect x="${p[0]-40}" y="0" width="80" height="${H}" fill="transparent" data-day="${i}" style="cursor:pointer"/>`).join('')}
  </svg>
  <div class="days">${TL.map((_,i)=>`<button class="${i===day?'active':''}" data-day="${i}" aria-pressed="${i===day}">${lang==='ja'?(i+1)+t('day'):t('day')+' '+(i+1)}</button>`).join('')}</div></section>`;
}

function mapView(){
  const layerList=['weather','flow','access','poi','stay'].filter(l=>scope==='pilot'||l!=='flow');
  return `<div class="toolbar"><span class="lab">${t('scope')}</span>${['pilot','all'].map(s=>`<button data-scope="${s}" class="${scope===s?'active':''}" aria-pressed="${scope===s}">${t(s)}</button>`).join('')}<span class="lab" style="margin-left:10px">${t('places')}</span><select id="placeSel" aria-label="${t('places')}">${(scope==='pilot'?PILOT:ALL).map((p,i)=>`<option value="${i}" ${i===site?'selected':''}>${loc(p)}</option>`).join('')}</select></div>
  <div class="layout"><aside class="panel layers"><h2>${t('layers')}</h2>${layerList.map(l=>{const k='L_'+l;return `<label><input type="checkbox" data-layer="${l}" ${layers.has(l)?'checked':''}><span>${t(k)}<small>${t(k+'S')}</small></span></label>`}).join('')}</aside>
  <section class="panel map"><div id="lmapHost"></div><div class="map-label">${t(scope==='pilot'?'mapNotePilot':'mapNoteAll')}</div><div class="basemaps" role="group" aria-label="Basemap">${Object.keys(BASEMAPS).map(k=>`<button data-base="${k}" class="${basemap===k?'active':''}" aria-pressed="${basemap===k}">${BASEMAPS[k][lang]}</button>`).join('')}</div><div class="map-foot">${t('mapFoot')}</div></section>
  <aside class="panel detail">${detail()}</aside></div>${timeline()}`;
}

function marketsView(){
  const jp=direction==='jp';
  const cards=jp?[
    [t('jp1'),'763,800',t('jp1d'),prov('obs',t('prov_jnto'))],
    [t('jp2'),'595,600',t('jp2d'),prov('obs',t('prov_jnto2'))],
    [t('jp3'),'4,736,000',t('jp3d'),prov('obs',t('prov_jnto'))]]:[
    [t('tw1'),t('tw1v'),t('tw1d'),prov('est',t('prov_news'))],
    [t('tw2'),t('tw2v'),t('tw2d'),prov('obs',t('prov_news'))],
    [t('tw3'),'—',t('tw3d'),prov('nc',t('prov_pending'))]];
  const src=jp?[['JNTO — Visitor arrivals, July 2026 (PDF)','https://asset.japan.travel/image/upload/v1787134368/pdf/Number_of_visitor_arrivals_to_Japan_in_July_2026.pdf'],['Travel Voice — September 2026 arrivals (citing JNTO)','https://www.travelvoice.jp/english/international-arrivals-in-japan-in-september-2026-were-down-5-0-to-3-1-million-yoy-reduction-for-two-consecutive-months/print'],['JNTO statistics portal','https://statistics.jnto.go.jp/en/']]:[['uanalyze — 2025 Japanese visitors (citing Tourism Administration)','https://uanalyze.com.tw/articles/2194250531'],['udn / CNA — Jan–Jun 2026 source-market ranking','https://udn.com/news/story/7266/9657561'],['Tourism Statistics Database','https://stat.taiwan.net.tw/']];
  return `<section class="wrap"><div class="direction">${['jp','tw'].map(d=>`<button data-dir="${d}" class="${direction===d?'active':''}" aria-pressed="${direction===d}">${t(d==='jp'?'toJP':'toTW')}</button>`).join('')}</div>
  <div class="grid3">${cards.map(c=>`<div class="panel"><h2>${c[0]}</h2><div class="big">${c[1]}</div><div class="delta">${c[2]}</div><div class="card-foot">${c[3]}</div></div>`).join('')}</div>
  <div class="grid3" style="margin-top:12px;grid-template-columns:1.2fr 1fr 1fr">
   <div class="panel"><h2>${t('decTitle')}</h2><p style="color:var(--text);font-size:16px">${t(jp?'decJP':'decTW')}</p><h3 style="margin-top:14px">${t('nextTitle')}</h3><p>${t(jp?'nextJP':'nextTW')}</p></div>
   <div class="panel"><h2>${t('defTitle')}</h2><ul class="src">${[1,2,3,4].map(i=>`<li>${t('def'+i)}</li>`).join('')}</ul></div>
   <div class="panel"><h2>${t('srcTitle')}</h2><ul class="src">${src.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noreferrer">${s[0]} ↗</a></li>`).join('')}</ul></div>
  </div></section>`;
}

function dataView(){
  const order=['now','verify','later','notnow'];
  const n=k=>SRC.filter(s=>s.st===k).length;
  const rows=SRC.filter(s=>filter==='all'||s.st===filter).sort((a,b)=>order.indexOf(a.st)-order.indexOf(b.st));
  return `<section class="wrap"><div class="ok">${lang==='en'?'Inventory read: 27 sources × 18 fields from the supplied CSV. The Google Sheet itself is not used.':'データ一覧を読込済：CSVの27件×18項目。Googleシート本体は使用していません。'}</div>
  <div class="counts">${order.map(k=>`<button class="count ${filter===k?'active':''}" data-filter="${k}" aria-pressed="${filter===k}"><span class="st ${k}">${t('c_'+k)}</span><b>${n(k)}</b></button>`).join('')}</div>
  ${filter!=='all'?`<button data-filter="all" style="margin-bottom:10px">${t('c_all')} (27)</button>`:''}
  <div class="panel tablewrap"><table><thead><tr>${['th_src','th_status','th_dec','th_grain','th_lim','th_chk'].map(k=>`<th>${t(k)}</th>`).join('')}</tr></thead><tbody>
  ${rows.map(s=>`<tr><td><b>${loc(s.n)}</b>${s.u?`<a class="g" href="${s.u}" target="_blank" rel="noreferrer">↗ ${s.u.replace(/^https?:\/\//,'').slice(0,40)}</a>`:''}</td><td><span class="st ${s.st}">${t('c_'+s.st)}</span></td><td>${loc(s.d)}</td><td class="mini">${s.g}</td><td>${loc(s.l)}</td><td class="mini">${loc(s.c)}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="log"><div class="panel"><h2>${t('logDone')}</h2><ul>${[1,2,3,4].map(i=>`<li>${t('logD'+i)}</li>`).join('')}</ul></div><div class="panel"><h2>${t('logBlocked')}</h2><ul>${[1,2,3,4].map(i=>`<li>${t('logB'+i)}</li>`).join('')}</ul></div></div></section>`;
}

function summaryView(){
  const col=(h,cls,keys)=>`<div class="panel"><span class="st ${cls}">${t(h)}</span><ul class="src" style="margin-top:10px">${keys.map(k=>`<li style="color:var(--text)">${t(k)}</li>`).join('')}</ul></div>`;
  return `<section class="wrap"><div class="grid3">${col('s_done','now',['done1','done2','done3'])}${col('s_rec','later',['rec1','rec2','rec3'])}${col('s_ver','verify',['ver1','ver2','ver3','ver4'])}</div><div class="notice">${t('gate')}</div><button data-view="data">${t('learn')} →</button></section>`;
}

function draw(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $('#en').setAttribute('aria-pressed',lang==='en');$('#ja').setAttribute('aria-pressed',lang==='ja');
  $('#en').classList.toggle('active',lang==='en');$('#ja').classList.toggle('active',lang==='ja');
  $('#nav').innerHTML=['map','markets','data','summary'].map(v=>`<button class="${view===v?'active':''}" data-view="${v}" aria-pressed="${view===v}">${t(v)}</button>`).join('');
  $('#help').textContent=t('help');
  const H={map:['mapTitle','mapSub'],markets:['marketTitle','marketSub'],data:['dataTitle','dataSub'],summary:['summaryTitle','summarySub']}[view];
  $('#heading').textContent=t(H[0]);$('#subheading').textContent=t(H[1]);
  $('#legend').innerHTML=`<span class="txt">${t('legendLab')}</span>${['obs','est','fc','ill','nc'].map(k=>prov(k)).join('')}<span class="txt" style="flex-basis:100%">${t('legendNote')}</span>`;
  $('#main').innerHTML=view==='map'?mapView():view==='markets'?marketsView():view==='data'?dataView():summaryView();
  if(view==='map')updateMap();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-day],[data-site],button');if(!el)return;
  if(el.id==='en'||el.id==='ja')lang=el.id;
  else if(el.id==='guide'){$('#help').classList.toggle('hidden');return}
  else if(el.dataset.view)view=el.dataset.view;
  else if(el.dataset.site!==undefined)site=+el.dataset.site;
  else if(el.dataset.day!==undefined)day=+el.dataset.day;
  else if(el.dataset.dir)direction=el.dataset.dir;
  else if(el.dataset.scope){if(scope!==el.dataset.scope){scope=el.dataset.scope;site=0;if(scope==='all')layers.delete('flow');else layers.add('flow')}}
  else if(el.dataset.filter)filter=el.dataset.filter;
  else if(el.dataset.base)basemap=el.dataset.base;
  else return;
  draw();
});
document.addEventListener('change',e=>{if(e.target.id==='placeSel'){site=+e.target.value;draw();return}if(e.target.dataset.layer){const l=e.target.dataset.layer;e.target.checked?layers.add(l):layers.delete(l);draw()}});
draw();

</script>
</body>
</html>
