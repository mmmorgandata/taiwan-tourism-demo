<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taiwan Tourism Intelligence — Concept demo</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js"></script>
<style>
:root{color-scheme:dark;--bg:#09121b;--panel:#101e2b;--panel2:#132434;--line:#263746;--muted:#99adba;--text:#edf4f6;--green:#8ee4cc;--amber:#e9c980;--blue:#8fc3ff;--purple:#b5b4ff;--red:#f2a0a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
button{font:inherit;color:inherit;border:1px solid var(--line);background:#172838;border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover,button.active{background:#29463f;border-color:var(--green)}
button:focus-visible,a:focus-visible{outline:3px solid var(--green);outline-offset:1px}
a{color:var(--green)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);gap:16px}
.brand{font-size:18px;font-weight:700;white-space:nowrap}.brand span{color:var(--green)}
nav{display:flex;gap:6px;flex-wrap:wrap}
.meta{display:flex;gap:6px;align-items:center}
.pill{display:inline-block;font-size:11px;letter-spacing:.04em;border:1px solid #6b6045;border-radius:20px;padding:3px 9px;color:var(--amber);white-space:nowrap}
.intro{padding:16px 24px 10px;display:flex;justify-content:space-between;align-items:end;gap:16px}
h1{font-size:26px;margin:2px 0 4px;font-weight:600}
p{color:var(--muted);margin:4px 0}
.eyebrow{color:var(--green);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:15px;margin:0 0 12px}h3{font-size:13px;margin:0 0 6px}
.mini{font-size:11px;color:var(--muted)}
.hidden{display:none!important}
.wrap{margin:0 24px 18px}
/* provenance chips */
.prov{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.03em;border-radius:20px;padding:2px 8px;border:1px solid;white-space:nowrap;vertical-align:middle}
.prov:before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.prov.obs{color:var(--green);border-color:#3f6d61}
.prov.est{color:var(--amber);border-color:#6b6045}
.prov.fc{color:var(--blue);border-color:#3e5c7c}
.prov.ill{color:var(--purple);border-color:#55547d;border-style:dashed}
.prov.nc{color:var(--muted);border-color:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:9px 14px;margin:0 24px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.legend span.txt{font-size:11px;color:var(--muted)}
/* map view */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 24px 12px}
.toolbar .lab{font-size:12px;color:var(--muted);margin-right:2px}
.layout{display:grid;grid-template-columns:230px minmax(340px,1fr) 300px;gap:12px;margin:0 24px}
.layers label{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.layers input{accent-color:var(--green);margin-top:3px}
.layers small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.map{position:relative;padding:0;overflow:hidden;background:#0c1b29;min-height:480px}
#lmapHost,#lmap{position:absolute;inset:0}
#lmap{background:#0c1b29;font:inherit}
.map-label{position:absolute;top:10px;left:56px;z-index:500;color:#cfe0e6;font-size:11px;background:#09121bcc;padding:4px 8px;border-radius:6px;pointer-events:none}
.basemaps{position:absolute;top:10px;right:10px;z-index:500;display:flex;gap:4px}
.basemaps button{padding:4px 9px;font-size:11.5px;background:#09121be6}
.map-foot{position:absolute;bottom:8px;left:10px;z-index:500;color:#cfe0e6;font-size:10.5px;background:#09121bcc;padding:3px 8px;border-radius:6px;pointer-events:none;max-width:60%}
.map-fallback{padding:40px;color:var(--muted)}
.leaflet-tooltip.lbl{background:#09121bdd;border:1px solid #31475a;color:#e6f0ef;font-size:12px;padding:2px 7px;border-radius:6px;box-shadow:none}
.leaflet-tooltip.lbl:before{display:none}
.leaflet-tooltip.lbl.sel{border-color:var(--green);color:var(--green);font-weight:700;z-index:1000}
.mk{margin-left:6px;font-size:10.5px;font-weight:600}.mk.poi{color:var(--amber)}.mk.stay{color:var(--purple)}
.leaflet-container a{color:#2a7d6a}.leaflet-control-attribution{font-size:10px}
.leaflet-bar a{background:#172838;color:#edf4f6;border-color:#263746}.leaflet-bar a:hover{background:#29463f}
.tiles-streets{filter:brightness(.8) saturate(.8)}
select{font:inherit;color:inherit;background:#172838;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.livebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto;font-size:11.5px}
.lv{border:1px solid var(--line);border-radius:20px;padding:2px 8px;color:var(--muted)}
.lv-ok{color:var(--green);border-color:#3f6d61}.lv-err{color:var(--red);border-color:#6d3f45}
.hours{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px}
.hh{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px}
.hgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.hgrid div{display:flex;flex-direction:column;gap:1px}.hgrid small{font-size:10px;color:var(--muted)}.hgrid b{font-size:14px}.hgrid span{font-size:11px;color:var(--blue)}
.days button.hol{color:var(--amber)}
.st.live{background:#1d3f4a;color:#8fe0f2}
.counts{grid-template-columns:repeat(5,1fr)!important}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cday{border:1px solid var(--line);border-radius:8px;padding:6px 7px;min-height:62px;font-size:11.5px;display:flex;flex-direction:column;gap:2px}
.cday b{font-size:12px}.cday span{color:var(--amber);font-size:11px}.cday.hol{background:#2a2a20}.cday em{font-style:normal;color:var(--green);font-size:11px}
.evf{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}.evf label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.evf input{font:inherit;color:inherit;background:#172838;border:1px solid var(--line);border-radius:8px;padding:6px 9px;color-scheme:dark}
button.tiny{padding:1px 6px;font-size:11px;margin-left:6px}
.walklbl{color:#8ee4cc;font-size:11px;font-weight:600;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap;transform:translate(-50%,-100%)}
@media(max-width:1100px){.cal{grid-template-columns:repeat(4,1fr)}.counts{grid-template-columns:repeat(2,1fr)!important}}
@media(max-width:680px){.cal{grid-template-columns:repeat(2,1fr)}.livebar{margin-left:0;width:100%}.hgrid b{font-size:12px}}
.cardwrap{background:none;border:0}
.ncard{position:absolute;white-space:nowrap;background:#09121bee;border:1px solid #31475a;border-radius:8px;padding:4px 8px 5px;font-size:11.5px;color:#e6f0ef;box-shadow:0 2px 10px #0007;cursor:pointer;line-height:1.35}
.ncard.sel{border-color:var(--green);box-shadow:0 0 0 1px var(--green),0 2px 12px #0008}
.ncard .cn{font-weight:700;font-size:12px}.ncard.sel .cn{color:var(--green)}
.ncard .cr{display:flex;align-items:center;gap:5px}.ncard .ci{width:16px;text-align:center;font-size:12px}
.ncard .cs{color:var(--muted);font-size:10.5px}.ncard .cs.ill{font-style:italic}.ncard .illv{color:#cfcfff;font-weight:600}
.ncard .cdot{width:9px;height:9px;border-radius:50%;margin:0 3px}
.ncard.d-right{transform:translate(12px,-50%)}.ncard.d-left{transform:translate(calc(-100% - 12px),-50%)}
.ncard.d-top{transform:translate(-50%,calc(-100% - 12px))}.ncard.d-bottom{transform:translate(-50%,12px)}
.ncard:hover{border-color:#8fc3ff;z-index:5}
.ncard.mini .cr~.cr{display:none}.ncard.tiny .cr{display:none}.ncard.tiny{padding:2px 7px;opacity:.92}.ncard.hide{display:none}
.leaflet-tooltip.tipd{background:#0b1724;border-color:#4a6378;box-shadow:0 4px 16px #000a;white-space:normal;width:280px;max-width:80vw;font-size:11.5px;line-height:1.5}
.tipd .tsrc{color:var(--muted);font-size:10px}
.pt{cursor:pointer}
.pt text{font-size:12px;fill:#dfe9ec;paint-order:stroke;stroke:#0b1a26;stroke-width:4px}
.pt.sel text{fill:var(--green);font-weight:700}
.pt:focus{outline:none}.pt:focus-visible circle.core{stroke:#fff;stroke-width:3}
.statrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.statrow .k{display:flex;flex-direction:column;gap:3px}
.statrow b{color:var(--text);font-size:15px;white-space:nowrap}
.statrow small{font-size:10.5px;color:var(--muted)}
.flow{margin-top:12px;padding:12px;background:#1a2f2a;border-radius:10px}
.flow ol{margin:6px 0 0;padding-left:18px;color:#b9cfc7;font-size:12px}
.flow li{margin:3px 0}
/* timeline */
.timeline{margin:12px 24px 18px;padding:10px 14px 8px}
.tl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:26px}
.tl-head h2{margin:0;font-size:13px}
.tl-head .val{font-size:12px;color:var(--muted)}
.tl-head .sp{flex:1}
.timeline svg{display:block;width:100%;height:170px;margin-top:4px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:2px}
.days button{padding:3px 0;font-size:11px;background:transparent;border-color:transparent;color:var(--muted)}
.days button.active{color:var(--green);border-color:#3f6d61;background:#16302a}
/* markets */
.direction{display:flex;gap:8px;margin:0 0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.big{font-size:28px;font-weight:600;color:var(--text);margin:8px 0 4px}
.delta{font-size:13px;color:var(--green)}
.card-foot{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.notice{padding:10px 14px;background:#292a22;border-left:3px solid #d6bc7b;color:#e1d8b9;font-size:12px;margin:12px 0}
.ok{padding:10px 14px;background:#16302a;border-left:3px solid var(--green);color:#cfe9df;font-size:12px;margin:12px 0}
ul.src{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--muted)}
ul.src li{margin:3px 0}
/* data table */
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.count{cursor:pointer;text-align:left;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.count b{display:block;font-size:24px;margin-top:2px}
.count.active{border-color:var(--green);background:#16302a}
.st{display:inline-block;font-size:11px;border-radius:6px;padding:2px 7px;white-space:nowrap;font-weight:600}
.st.now{background:#1d4a3f;color:var(--green)}
.st.verify{background:#4a3f1d;color:var(--amber)}
.st.later{background:#24364a;color:var(--blue)}
.st.notnow{background:#3a2328;color:var(--red)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
td,th{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:11.5px;position:sticky;top:0;background:var(--panel)}
td .g{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.tablewrap{overflow:auto;max-height:none}
.log{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.log ul{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--muted)}
.log li{margin:4px 0}
.footer{margin:6px 24px 22px;font-size:11.5px;color:var(--muted)}
.help{margin:0 24px 12px;font-size:13px;color:var(--muted)}
@media(max-width:1100px){.layout{grid-template-columns:200px 1fr}.detail{grid-column:1/-1}.grid3,.log{grid-template-columns:1fr}.counts{grid-template-columns:repeat(2,1fr)}header{flex-wrap:wrap}}
@media(max-width:680px){header,.intro{padding:12px 14px}.layout,.toolbar,.legend,.wrap,.timeline,.help,.footer{margin-left:12px;margin-right:12px}.layout{grid-template-columns:1fr}.layers{display:flex;flex-wrap:wrap;gap:4px 12px}.layers h2{width:100%;margin:0}.layers label{padding:4px 0;border:0}.layers small{display:none}.intro{flex-direction:column;align-items:start}h1{font-size:22px}.map{min-height:440px}.map-label,.map-foot{display:none}.basemaps button{padding:3px 7px;font-size:11px}.timeline svg{height:140px}.days button{font-size:10px}table{display:block;overflow:auto}}
</style>
</head>

</section>
<div id="help" class="help panel hidden"></div>
<div class="legend" id="legend"></div>
<main id="main"></main>
<footer class="footer" data-i="footer"></footer>

function project(pts,W,H,pad){ // pts: [lat,lon]
  const lats=pts.map(p=>p[0]),lons=pts.map(p=>p[1]);
  const midLat=(Math.min(...lats)+Math.max(...lats))/2,kx=Math.cos(midLat*Math.PI/180);
  const x0=Math.min(...lons),x1=Math.max(...lons),y0=Math.min(...lats),y1=Math.max(...lats);
  const s=Math.min((W-2*pad)/((x1-x0)*kx),(H-2*pad)/(y1-y0));
  const ox=(W-(x1-x0)*kx*s)/2,oy=(H-(y1-y0)*s)/2;
  return ([lat,lon])=>[ox+(lon-x0)*kx*s,oy+(y1-lat)*s];
}

let basemap='dark',lmap=null,mapEl=null,baseGroup=null,overlay=null,lastScope=null;
function ensureMap(){
  if(typeof L==='undefined')return null;
  if(lmap)return lmap;
  mapEl=document.createElement('div');mapEl.id='lmap';mapEl.setAttribute('aria-label','Map');
  lmap=L.map(mapEl,{zoomControl:true,attributionControl:true,zoomSnap:.25,scrollWheelZoom:true});
  mapEl.style.position='absolute';mapEl.style.inset='0';
  lmap.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  lmap.createPane('nodes').style.zIndex=610;lmap.createPane('cards').style.zIndex=620;
  baseGroup=L.layerGroup().addTo(lmap);overlay=L.layerGroup().addTo(lmap);
  let zt=null;lmap.on('zoomend',()=>{clearTimeout(zt);zt=setTimeout(()=>{if(view==='map')updateMap()},60)});
  return lmap;
}
function setBase(){baseGroup.clearLayers();BASEMAPS[basemap].layers.forEach(([u,o])=>baseGroup.addLayer(L.tileLayer(u,o)))}
function updateMap(){
  const host=document.getElementById('lmapHost');if(!host)return;
  if(!ensureMap()){host.innerHTML=`<div class="map-fallback">${lang==='en'?'Map library failed to load.':'地図ライブラリを読み込めませんでした。'}</div>`;return}
  host.appendChild(mapEl);
  if(baseGroup._base!==basemap){setBase();baseGroup._base=basemap}
  overlay.clearLayers();
  const P=scope==='pilot'?PILOT:ALL,maxE=P[0][4];
  if(layers.has('access')){
    if(scope==='pilot')LINES.forEach(l=>overlay.addLayer(L.polyline(l.p,{color:l.c,weight:4,opacity:.75,dashArray:'1 0'})));
    else{overlay.addLayer(L.polyline(HSR,{color:'#e8a35b',weight:3,opacity:.85,dashArray:'8 6'}));overlay.addLayer(L.polyline(EAST,{color:'#b5b4ff',weight:3,opacity:.85,dashArray:'4 6'}))}
  }
  liveOverlays();
  const compact=isNarrow()||lmap.getZoom()<(scope==='pilot'?11.5:6.5);
  P.forEach((p,i)=>{
    const ll=[p[2],p[3]],sel=i===site,rel=p[4]/maxE;
    if(layers.has('flow')&&scope==='pilot')overlay.addLayer(L.circle(ll,{radius:250+rel*900,stroke:false,fillColor:'#8ee4cc',fillOpacity:.18,interactive:false}));
    if(layers.has('weather')){const W=LIVE.wx&&(scope==='pilot'?LIVE.wx.pilot:LIVE.wx.all)[i];const r=W?Math.max(0,...W.hourly.precipitation_probability.slice(nowIdx(W),nowIdx(W)+6).filter(x=>x!=null)):rain(i,day);overlay.addLayer(L.circleMarker(ll,{radius:10+r/7,color:'#8fc3ff',weight:2,opacity:r/110,dashArray:'2 4',fill:false,interactive:false}))}
    if(scope==='all'&&layers.has('poi'))overlay.addLayer(L.circle(ll,{radius:4000+rel*16000,stroke:false,fillColor:'#e9c980',fillOpacity:.12,interactive:false}));
    const m=L.circleMarker(ll,{radius:sel?9:6,color:'#0b1a26',weight:2,fillColor:sel?'#8ee4cc':'#e6f0ef',fillOpacity:1,bubblingMouseEvents:false,pane:'nodes'});
    m.bindTooltip(()=>nodeDetail(p,i),{direction:'auto',className:'lbl tipd',sticky:true,offset:[14,0]});
    m.on('click',()=>{site=i;draw()});overlay.addLayer(m);
    const dir=scope==='pilot'?PILOT_DIR[i]:(ALL_DIR[i]||'right');
    const c=L.marker(ll,{pane:'cards',icon:L.divIcon({className:'cardwrap',iconSize:[0,0],iconAnchor:[0,0],html:nodeCard(p,i,sel,dir,compact&&!sel)}),keyboard:false,riseOnHover:true});
    c.bindTooltip(()=>nodeDetail(p,i),{direction:'auto',className:'lbl tipd',sticky:true,offset:[14,0]});
    c.on('click',()=>{site=i;draw()});overlay.addLayer(c);
  });
  setTimeout(declutter,0);
  if(lastScope!==scope){lastScope=scope;requestAnimationFrame(()=>{lmap.invalidateSize();lmap.fitBounds(L.latLngBounds(P.map(p=>[p[2],p[3]])),isNarrow()?{paddingTopLeft:[20,50],paddingBottomRight:[70,30]}:{paddingTopLeft:[40,70],paddingBottomRight:[150,70]})})}
  else requestAnimationFrame(()=>lmap.invalidateSize());
}

/* ---------- node cards (DHDE SiteCards pattern: one card per node, one row per active layer, hover for detail) ---------- */
const isNarrow=()=>window.matchMedia('(max-width:680px)').matches;
function wxIcon(c){if(c==null)return '·';if(c===0)return '☀️';if(c<=2)return '🌤️';if(c===3)return '☁️';if(c===45||c===48)return '🌫️';if(c<=57)return '🌦️';if(c<=67)return '🌧️';if(c<=77)return '❄️';if(c<=82)return '🌦️';return '⛈️'}
function nodeW(i){return LIVE.wx?(scope==='pilot'?LIVE.wx.pilot:LIVE.wx.all)[i]:null}
function pop6(w){const k=nowIdx(w),a=w.hourly.precipitation_probability.slice(k,k+6).filter(x=>x!=null);return a.length?Math.max(...a):null}
function cardRowsFor(p,i){
  const rows=[],w=nodeW(i),f=1+(TL[day]-100)/250,sel=i===site;
  if(layers.has('weather'))rows.push(w?`<span class="ci">${wxIcon(w.current.weather_code)}</span><b>${Math.round(w.current.temperature_2m)}°</b><span class="cs">☂ ${scope==='pilot'?pop6(w):w.daily.precipitation_probability_max[0]}%</span>`:`<span class="ci">☁️</span><span class="cs">${LIVE.status.wx==='err'?'✕':'…'}</span>`);
  if(scope==='pilot'&&layers.has('road')){const r=hubRoad(p);rows.push(r&&r.n?`<span class="cdot" style="background:${speedColor(r.speed)}"></span><b>${Math.round(r.speed)}</b><span class="cs">km/h</span>`:`<span class="cdot" style="background:#55606a"></span><span class="cs">${r?'—':'…'} km/h</span>`)}
  if(scope==='pilot'&&layers.has('bike')){const b=hubBike(p);rows.push(b&&b.n?`<span class="ci">🚲</span><b>${b.bikes}</b><span class="cs">/ ${b.total}</span>`:`<span class="ci">🚲</span><span class="cs">${b?'—':'…'}</span>`)}
  if(sel&&scope==='pilot'&&layers.has('flow'))rows.push(`<span class="ci">👥</span><b class="illv">~${fmt(Math.round(p[4]*f/1000))}k</b><span class="cs ill">${lang==='en'?'illus.':'例示'}</span>`);
  if(sel&&scope==='all')rows.push(`<span class="ci">👥</span><b class="illv">~${fmt(Math.round(p[4]*f))}</b><span class="cs ill">${lang==='en'?'illus.':'例示'}</span>`);
  if(sel&&layers.has('poi')&&p[5])rows.push(`<span class="ci" style="color:#e9c980">▲</span><b class="illv">${p[5]}</b><span class="cs ill">${lang==='en'?'events · illus.':'イベント · 例示'}</span>`);
  if(sel&&layers.has('stay'))rows.push(`<span class="ci" style="color:#b5b4ff">■</span><b class="illv">${p[6]}</b><span class="cs ill">${lang==='en'?'lodgings · illus.':'宿泊 · 例示'}</span>`);
  return rows;
}
function nodeCard(p,i,sel,dir,compact){
  const rows=cardRowsFor(p,i);

  return `<div class="ncard d-${dir}${sel?' sel':''}" data-ci="${i}"><div class="cn">${esc(L_(p))}</div>${body}</div>`;
}
/* Declutter (DHDE Declutter idea): selected card first, then in list order; a card that overlaps one already placed
   drops to its first row, then to its name only. Hover any card for the full detail. */
function declutter(){
  const els=[...document.querySelectorAll('#lmap .ncard')];if(!els.length)return;
  const D=['right','left','top','bottom'],setDir=(e,d)=>{D.forEach(x=>e.classList.remove('d-'+x));e.classList.add('d-'+d)};
  els.forEach(e=>{e.classList.remove('mini','tiny','hide');e.dataset.dir0=e.dataset.dir0||[...e.classList].find(c=>c.startsWith('d-')).slice(2)});
  els.sort((x,y)=>(y.classList.contains('sel')-x.classList.contains('sel'))||(+x.dataset.ci-+y.dataset.ci));
  const placed=[],hit=r=>placed.some(q=>r.left<q.right+2&&r.right>q.left-2&&r.top<q.bottom+2&&r.bottom>q.top-2);
  for(const e of els){const d0=e.dataset.dir0,dirs=[d0,...D.filter(x=>x!==d0)];let ok=false;
    for(const size of ['', 'mini','tiny']){e.classList.remove('mini','tiny');if(size)e.classList.add(size);
      for(const d of dirs){setDir(e,d);if(!hit(e.getBoundingClientRect())){ok=true;break}}
      if(ok)break}
    if(!ok){setDir(e,d0);e.classList.add('hide');continue}
    placed.push(e.getBoundingClientRect())}
}

/* ---------- Live data, read by the browser (DHDE pattern: on load + timer; each source can fail on its own) ---------- */
const TDX='https://tdx.transportdata.tw/api/basic';
const LIVE={wx:null,vd:null,vdPos:null,vdTime:null,yb:null,alert:null,cal:null,status:{},at:{}};
const LIVE_MS=5*60*1000;
const getJSON=async u=>{const c=new AbortController(),tm=setTimeout(()=>c.abort(),20000);try{const r=await fetch(u,{cache:'no-store',signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(tm)}};
const stamp=(k,ok,e)=>{LIVE.status[k]=ok?'ok':'err';if(ok)LIVE.at[k]=new Date();else console.warn('live source failed:',k,e&&e.message)};
async function loadWeather(){
  const pts=[...PILOT,...ALL];
  const u='https://api.open-meteo.com/v1/forecast?latitude='+pts.map(p=>p[2]).join(',')+'&longitude='+pts.map(p=>p[3]).join(',')+
   '&current=temperature_2m,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,precipitation'+
   '&daily=precipitation_probability_max,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Asia%2FTaipei&forecast_days=8';
  const j=await getJSON(u),arr=Array.isArray(j)?j:[j];
  LIVE.wx={pilot:arr.slice(0,PILOT.length),all:arr.slice(PILOT.length)};
}
async function loadVD(){
  if(!LIVE.vdPos){const s=await getJSON(TDX+'/v2/Road/Traffic/VD/City/Taipei?%24format=JSON');LIVE.vdPos={};s.VDs.forEach(v=>LIVE.vdPos[v.VDID]=[v.PositionLat,v.PositionLon,v.RoadName])}
  const l=await getJSON(TDX+'/v2/Road/Traffic/Live/VD/City/Taipei?%24format=JSON');
  LIVE.vd=l.VDLives.map(v=>{const p=LIVE.vdPos[v.VDID];const lanes=(v.LinkFlows||[]).flatMap(f=>f.Lanes||[]).filter(x=>x.Speed>0&&x.Speed<150);
    if(!p||!lanes.length)return null;
    return {lat:p[0],lon:p[1],road:p[2],speed:lanes.reduce((a,x)=>a+x.Speed,0)/lanes.length,occ:lanes.reduce((a,x)=>a+Math.max(0,x.Occupancy||0),0)/lanes.length}}).filter(Boolean);
  LIVE.vdTime=l.SrcUpdateTime||l.UpdateTime;
}
async function loadYB(){

  LIVE.yb=j.filter(s=>s.act==='1').map(s=>({n:s.sna.replace('YouBike2.0_',''),ne:(s.snaen||'').replace('YouBike2.0_',''),lat:+s.latitude,lon:+s.longitude,bikes:+s.available_rent_bikes,total:+s.Quantity}));
}
async function loadAlert(){const j=await getJSON(TDX+'/v2/Rail/Metro/Alert/TRTC?%24format=JSON');LIVE.alert=j.Alerts||[]}
async function loadCal(){
  const y=+todayTW().slice(0,4),res=await Promise.allSettled([y,y+1].map(Y=>getJSON(`https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data/${Y}.json`)));
  LIVE.cal={};res.forEach(r=>{if(r.status==='fulfilled')r.value.forEach(d=>LIVE.cal[d.date]=d)});

let liveTimer=null;
async function refreshLive(first){
  const jobs={wx:loadWeather,vd:loadVD,yb:loadYB,alert:loadAlert};if(first)jobs.cal=loadCal;
  let rt=null;const redraw=()=>{clearTimeout(rt);rt=setTimeout(()=>{if(view==='map'||view==='calendar')draw()},150)};
  await Promise.all(Object.entries(jobs).map(([k,f])=>f().then(()=>stamp(k,true)).catch(e=>stamp(k,false,e)).finally(redraw)));
}
function startLive(){if(liveTimer)return;refreshLive(true);liveTimer=setInterval(()=>refreshLive(false),LIVE_MS)}

/* ---------- helpers ---------- */
function todayTW(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'}).format(new Date())} // YYYY-MM-DD
function addDays(iso,n){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
const dist=(a,b,c,d)=>{const k=Math.PI/180;return Math.hypot((d-b)*k*Math.cos((a+c)/2*k),(c-a)*k)*6371000};
const hhmm=d=>d?d.toLocaleTimeString(lang==='ja'?'ja-JP':'en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Taipei'}):'';
function wxOf(){if(!LIVE.wx)return null;return (scope==='pilot'?LIVE.wx.pilot:LIVE.wx.all)[site]||null}
function nowIdx(w){const h=w.current.time.slice(0,13)+':00';const i=w.hourly.time.indexOf(h);return i<0?0:i}
function rainClass(mm){return mm<=0?0:mm<2.5?1:mm<10?2:3}
function wxText(c){const E=lang==='en';if(c==null)return '';if(c===0)return E?'Clear':'快晴';if(c<=3)return E?'Partly cloudy':'晴れ時々曇り';if(c===45||c===48)return E?'Fog':'霧';if(c<=57)return E?'Drizzle':'霧雨';if(c<=67)return E?'Rain':'雨';if(c<=77)return E?'Snow':'雪';if(c<=82)return E?'Showers':'にわか雨';return E?'Thunderstorm':'雷雨'}
function hubRoad(p){if(!LIVE.vd)return null;const v=LIVE.vd.filter(x=>dist(p[2],p[3],x.lat,x.lon)<=600);if(!v.length)return {n:0};return {n:v.length,speed:v.reduce((a,x)=>a+x.speed,0)/v.length,occ:v.reduce((a,x)=>a+x.occ,0)/v.length}}
function hubBike(p){if(!LIVE.yb)return null;const s=LIVE.yb.filter(x=>dist(p[2],p[3],x.lat,x.lon)<=400);return {n:s.length,bikes:s.reduce((a,x)=>a+x.bikes,0),total:s.reduce((a,x)=>a+x.total,0)}}
const speedColor=s=>s<20?'#f2a0a0':s<35?'#e9c980':'#8ee4cc';
const bikeColor=(b,t)=>!t||b===0?'#f2a0a0':b/t<.2?'#e9c980':'#8ee4cc';
function metroStatus(){if(!LIVE.alert)return null;const a=LIVE.alert;const normal=!a.length||a.every(x=>x.Status===1&&/正常/.test(x.Title||''));return normal?t('normalSvc'):a.map(x=>x.Title).join(' / ')}

  <label>${t('calPlace')}<select name="site">${PILOT.map((p,i)=>`<option value="pilot:${i}">${loc(p)}</option>`).join('')}${ALL.map((p,i)=>`<option value="all:${i}">${loc(p)} (${t('all')})</option>`).join('')}</select></label>
  <label>${t('calName')}<input name="title" required maxlength="60"></label>
  <label>${t('calScale')}<select name="size"><option value="small">${t('s_small')}</option><option value="medium">${t('s_medium')}</option><option value="large">${t('s_large')}</option></select></label>
  <button type="submit">${t('calSave')}</button></form><p class="mini">${prov('est',t('calMineTag'))} ${t('calMine')}</p>
  <ul class="src">${ev.length?ev.map((e,i)=>`<li>${esc(e.date)} · ${esc(e.title)} <button class="tiny" data-delev="${i}">${t('calDel')}</button></li>`).join(''):`<li>${t('calNone')}</li>`}</ul></div></div></section>`;
}

function timingPanel(){
  const col=(h,keys)=>`<div class="panel"><h3>${t(h)}</h3><ul class="src">${keys.map(([k,st])=>`<li><span class="st ${st}">${t('c_'+st)}</span> ${t(k)}</li>`).join('')}</ul></div>`;
  return `<h2 style="margin:16px 0 8px">${t('timingTitle')}</h2><div class="grid3">${col('tBefore',[['tb1','live'],['tb2','live'],['tb3','now'],['tb4','verify']])}${col('tNow',[['tn1','live'],['tn2','live'],['tn3','live'],['tn4','live'],['tn5','verify']])}${col('tAfter',[['ta1','now'],['ta2','now'],['ta3','later'],['ta4','verify']])}</div>`;
}

function dataView(){
  const order=['live','now','verify','later','notnow'];
  const n=k=>SRC.filter(s=>s.st===k).length;
  const rows=SRC.filter(s=>filter==='all'||s.st===filter).sort((a,b)=>order.indexOf(a.st)-order.indexOf(b.st));
  return `<section class="wrap"><div class="ok">${t('invNote')}</div>
  <div class="counts">${order.map(k=>`<button class="count ${filter===k?'active':''}" data-filter="${k}" aria-pressed="${filter===k}"><span class="st ${k}">${t('c_'+k)}</span><b>${n(k)}</b></button>`).join('')}</div>
  ${filter!=='all'?`<button data-filter="all" style="margin-bottom:10px">${t('c_all')} (${SRC.length})</button>`:''}
  <div class="panel tablewrap"><table><thead><tr>${['th_src','th_status','th_dec','th_grain','th_lim','th_chk'].map(k=>`<th>${t(k)}</th>`).join('')}</tr></thead><tbody>
  ${rows.map(s=>`<tr><td><b>${loc(s.n)}</b>${s.u?`<a class="g" href="${s.u}" target="_blank" rel="noreferrer">↗ ${s.u.replace(/^https?:\/\//,'').slice(0,40)}</a>`:''}</td><td><span class="st ${s.st}">${t('c_'+s.st)}</span></td><td>${loc(s.d)}</td><td class="mini">${s.g}</td><td>${loc(s.l)}</td><td class="mini">${loc(s.c)}</td></tr>`).join('')}
  </tbody></table></div>${timingPanel()}
  <div class="log"><div class="panel"><h2>${t('logDone')}</h2><ul>${[1,2,3,4,5].map(i=>`<li>${t('logD'+i)}</li>`).join('')}</ul></div><div class="panel"><h2>${t('logBlocked')}</h2><ul>${[1,2,3,4].map(i=>`<li>${t('logB'+i)}</li>`).join('')}</ul></div></div></section>`;
}

function summaryView(){
  const col=(h,cls,keys)=>`<div class="panel"><span class="st ${cls}">${t(h)}</span><ul class="src" style="margin-top:10px">${keys.map(k=>`<li style="color:var(--text)">${t(k)}</li>`).join('')}</ul></div>`;
  return `<section class="wrap"><div class="grid3">${col('s_done','live',['done1','done2','done3','done4'])}${col('s_rec','later',['rec1','rec2','rec3'])}${col('s_ver','verify',['ver1','ver2','ver3','ver4'])}</div>
  <div class="panel" style="margin-top:12px"><h2>${t('predTitle')}</h2><table><thead><tr><th>${t('pq')}</th><th>${t('ph')}</th><th>${t('pd')}</th><th>${t('pst')}</th></tr></thead><tbody>${[1,2,3].map(i=>`<tr><td><b>${t('p'+i+'q')}</b></td><td>${t('p'+i+'h')}</td><td>${t('p'+i+'d')}</td><td>${t('p'+i+'s')}</td></tr>`).join('')}</tbody></table><p class="mini" style="margin-top:8px">${t('predNote')}</p></div>
  <div class="notice">${t('gate')}</div><button data-view="data">${t('learn')} →</button></section>`;
}

function rain(i,d){return [30,45,60,40,25,55,70][(i+d)%7]}

function marketsView(){
  const jp=direction==='jp';
  const cards=jp?[
    [t('jp1'),'763,800',t('jp1d'),prov('obs',t('prov_jnto'))],
    [t('jp2'),'595,600',t('jp2d'),prov('obs',t('prov_jnto2'))],
    [t('jp3'),'4,736,000',t('jp3d'),prov('obs',t('prov_jnto'))]]:[
    [t('tw1'),t('tw1v'),t('tw1d'),prov('est',t('prov_news'))],
    [t('tw2'),t('tw2v'),t('tw2d'),prov('obs',t('prov_news'))],
    [t('tw3'),'—',t('tw3d'),prov('nc',t('prov_pending'))]];
  const src=jp?[['JNTO — Visitor arrivals, July 2026 (PDF)','https://asset.japan.travel/image/upload/v1787134368/pdf/Number_of_visitor_arrivals_to_Japan_in_July_2026.pdf'],['Travel Voice — September 2026 arrivals (citing JNTO)','https://www.travelvoice.jp/english/international-arrivals-in-japan-in-september-2026-were-down-5-0-to-3-1-million-yoy-reduction-for-two-consecutive-months/print'],['JNTO statistics portal','https://statistics.jnto.go.jp/en/']]:[['uanalyze — 2025 Japanese visitors (citing Tourism Administration)','https://uanalyze.com.tw/articles/2194250531'],['udn / CNA — Jan–Jun 2026 source-market ranking','https://udn.com/news/story/7266/9657561'],['Tourism Statistics Database','https://stat.taiwan.net.tw/']];
  return `<section class="wrap"><div class="direction">${['jp','tw'].map(d=>`<button data-dir="${d}" class="${direction===d?'active':''}" aria-pressed="${direction===d}">${t(d==='jp'?'toJP':'toTW')}</button>`).join('')}</div>
  <div class="grid3">${cards.map(c=>`<div class="panel"><h2>${c[0]}</h2><div class="big">${c[1]}</div><div class="delta">${c[2]}</div><div class="card-foot">${c[3]}</div></div>`).join('')}</div>
  <div class="grid3" style="margin-top:12px;grid-template-columns:1.2fr 1fr 1fr">
   <div class="panel"><h2>${t('decTitle')}</h2><p style="color:var(--text);font-size:16px">${t(jp?'decJP':'decTW')}</p><h3 style="margin-top:14px">${t('nextTitle')}</h3><p>${t(jp?'nextJP':'nextTW')}</p></div>
   <div class="panel"><h2>${t('defTitle')}</h2><ul class="src">${[1,2,3,4].map(i=>`<li>${t('def'+i)}</li>`).join('')}</ul></div>
   <div class="panel"><h2>${t('srcTitle')}</h2><ul class="src">${src.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noreferrer">${s[0]} ↗</a></li>`).join('')}</ul></div>
  </div></section>`;
}

function draw(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $('#en').setAttribute('aria-pressed',lang==='en');$('#ja').setAttribute('aria-pressed',lang==='ja');
  $('#en').classList.toggle('active',lang==='en');$('#ja').classList.toggle('active',lang==='ja');
  $('#nav').innerHTML=['map','calendar','markets','data','summary'].map(v=>`<button class="${view===v?'active':''}" data-view="${v}" aria-pressed="${view===v}">${t(v)}</button>`).join('');
  $('#help').textContent=t('help');
  const H={map:['mapTitle','mapSub'],calendar:['calTitle','calSub'],markets:['marketTitle','marketSub'],data:['dataTitle','dataSub'],summary:['summaryTitle','summarySub']}[view];
  $('#heading').textContent=t(H[0]);$('#subheading').textContent=t(H[1]);
  $('#legend').innerHTML=`<span class="txt">${t('legendLab')}</span>${['obs','est','fc','ill','nc'].map(k=>prov(k)).join('')}<span class="txt" style="flex-basis:100%">${t('legendNote')}</span>`;
  $('#main').innerHTML=view==='map'?mapView():view==='calendar'?calendarView():view==='markets'?marketsView():view==='data'?dataView():summaryView();
  if(view==='map')updateMap();
  startLive();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-day],[data-site],button');if(!el)return;
  if(el.id==='en'||el.id==='ja')lang=el.id;
  else if(el.id==='guide'){$('#help').classList.toggle('hidden');return}
  else if(el.dataset.view)view=el.dataset.view;
  else if(el.dataset.site!==undefined)site=+el.dataset.site;
  else if(el.dataset.day!==undefined)day=+el.dataset.day;
  else if(el.dataset.dir)direction=el.dataset.dir;
  else if(el.dataset.scope){if(scope!==el.dataset.scope){scope=el.dataset.scope;site=0;if(scope==='all')layers.delete('flow');else layers.add('flow')}}
  else if(el.dataset.filter)filter=el.dataset.filter;
  else if(el.dataset.base)basemap=el.dataset.base;
  else if(el.dataset.delev!==undefined){const ev=loadEvents();ev.splice(+el.dataset.delev,1);saveEvents(ev)}
  else return;
  draw();
});
document.addEventListener('submit',e=>{if(e.target.id!=='evForm')return;e.preventDefault();const f=new FormData(e.target);const [sc,si]=String(f.get('site')).split(':');const ev=loadEvents();ev.push({date:f.get('date'),scope:sc,site:+si,title:String(f.get('title')).slice(0,60),size:f.get('size')});ev.sort((x,y)=>x.date<y.date?-1:1);saveEvents(ev);draw()});
document.addEventListener('change',e=>{if(e.target.id==='placeSel'){site=+e.target.value;draw();return}if(e.target.dataset.layer){const l=e.target.dataset.layer;e.target.checked?layers.add(l):layers.delete(l);draw()}});
draw();

</script>
</body>
</html>
